name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  maps:
    name: wire maps + qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Contract A — provider-maps.cjs
        run: node tools/test-provider-maps.cjs
      - name: Contract B — provider-maps-hop.cjs
        run: node tools/test-provider-maps-hop.cjs
      - name: repo self-check (leaks, refs, compile)
        run: python tools/qa.py
      - name: Claude shim — offline unit tests
        run: |
          pip install 'anthropic>=1'
          python tools/test-claude-shim.py
      - name: Codex shim — offline unit tests
        run: python tools/test-codex-shim.py
      - name: Box hop executor — offline unit tests
        run: node tools/test-hop-executor.cjs
      - name: Box patcher — offline unit tests
        run: python tools/test-apply-box-patch.py
      - name: Box supervisor restart — offline unit tests
        run: python tools/test-box-restart-host.py
      - name: Box bindings — offline unit tests
        run: python tools/test-box-bind.py
